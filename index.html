<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAYF | طيف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      background: #0d1b2e;
      border: 1px solid #1b3552;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .logo span {
      color: #35d0ba;
    }

    .connection {
      margin-top: 8px;
      color: #35d0ba;
      font-size: 14px;
    }

    .card {
      background: #0d1b2e;
      border: 1px solid #1b3552;
      border-radius: 18px;
      padding: 20px;
      max-width: 700px;
    }

    .vehicle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .vehicle-id {
      font-size: 26px;
      font-weight: bold;
    }

    .source {
      color: #8da6bd;
      margin-top: 5px;
    }

    .status {
      background: #123c3a;
      color: #35d0ba;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .data-box {
      background: #091728;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #142b43;
    }

    .label {
      color: #8da6bd;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 20px;
      font-weight: bold;
    }

    .live {
      color: #35d0ba;
    }

    .updated {
      margin-top: 18px;
      color: #8da6bd;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .data-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">TAYF | <span>طيف</span></div>
    <div class="connection">● لوحة طيف متصلة</div>
  </div>

  <div class="card">

    <div class="vehicle-header">

      <div>
        <div class="vehicle-id">SIM-01</div>
        <div class="source">simulated</div>
      </div>

      <div class="status">CONNECTED</div>

    </div>

    <div class="data-grid">

      <div class="data-box">
        <div class="label">vehicle_id</div>
        <div class="value">SIM-01</div>
      </div>

      <div class="data-box">
        <div class="label">source_type</div>
        <div class="value">simulated</div>
      </div>

      <div class="data-box">
        <div class="label">link_state</div>
        <div class="value live">connected</div>
      </div>

      <div class="data-box">
        <div class="label">mode</div>
        <div class="value">LOITER</div>
      </div>

      <div class="data-box">
        <div class="label">armed</div>
        <div class="value">false</div>
      </div>

      <div class="data-box">
        <div class="label">altitude_m</div>
        <div class="value">0.02 m</div>
      </div>

      <div class="data-box">
        <div class="label">battery_percent</div>
        <div class="value">100%</div>
      </div>

      <div class="data-box">
        <div class="label">timestamp</div>
        <div class="value">Live</div>
      </div>

    </div>

    <div class="updated">
      آخر تحديث: بانتظار بيانات SIM-01 الحية
    </div>

  </div>

</body>
</html>
